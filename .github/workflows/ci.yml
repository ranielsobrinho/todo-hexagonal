name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, type-check and tests
    runs-on: ubuntu-latest

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate gRPC code
        run: pnpm proto:generate

      - name: Lint (formatting)
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck:tests

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
