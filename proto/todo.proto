syntax = "proto3";

package todo.v1;

import "google/protobuf/empty.proto";

message Todo {
  string id = 1;
  string name = 2;
  string created_at = 3;
  bool done = 4;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message CreateTodoRequest { string name = 1; }
message GetTodoByIdRequest { string id = 1; }
message ListTodosRequest { int32 limit = 1; int32 offset = 2; }
message UpdateTodoRequest {
  string id = 1;
  string name = 2;
}
message DeleteTodoRequest { string id = 1; }
message FinishTodoRequest { string id = 1; }

service TodoService {
  rpc CreateTodo (CreateTodoRequest) returns (Todo);
  rpc GetTodoById (GetTodoByIdRequest) returns (Todo);
  rpc ListTodos (ListTodosRequest) returns (ListTodosResponse);
  rpc UpdateTodo (UpdateTodoRequest) returns (Todo);
  rpc DeleteTodo (DeleteTodoRequest) returns (google.protobuf.Empty);
  rpc FinishTodo (FinishTodoRequest) returns (google.protobuf.Empty);
  rpc CreateTodosStream (stream CreateTodoRequest) returns (stream FailedTodo);
}

message FailedTodo {
  string name = 1;
  string reason = 2;
}
