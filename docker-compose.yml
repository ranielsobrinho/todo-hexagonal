services:
  db:
    image: postgres:16
    container_name: todo_hexagonal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo_hexagonal
    ports:
      - '5432:5432'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todo -d todo_hexagonal']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  todo_pgdata:
